# Aggiunte al Compose di produzione **solo per le prove di sicurezza** (1F-W4 T3): mai sul server.
# Apre il database e l'archivio su 127.0.0.1 per scrivere il seme sintetico e contare le righe,
# e **non tocca nessuna variabile dell'API**: limiti e attese dell'accesso restano quelli veri.
#
#   docker compose -f infra/deploy/compose.yml -f infra/deploy/tests/compose.sicurezza.yml ...
services:
  db:
    ports:
      - '127.0.0.1:${SIC_DB_PORT:?manca SIC_DB_PORT}:5432'
    # La rete `data` è interna e non pubblica porte: serve una rete in più.
    networks: [data, prova]

  objects:
    ports:
      - '127.0.0.1:${SIC_OBJECTS_PORT:?manca SIC_OBJECTS_PORT}:9000'
    networks: [data, prova]

networks:
  prova: {}
