# =====================================================================
# Compose di produzione e di staging (1F-W2 T6; ADR-009 §4, DR-296, DR-359).
#
# Stesso file per i due ambienti: cambia solo il file d'ambiente.
#
#   docker compose -f infra/deploy/compose.yml --env-file <ambiente>.env up -d --wait
#   docker compose -f infra/deploy/compose.yml --env-file <ambiente>.env --profile release run --rm migrate
#
# - Il progetto si chiama `amoris-<AMORIS_ENV>`: volumi e reti di produzione e di staging
#   non si toccano. AMORIS_ENV vale `production` o `staging` (deve esistere ambiente/<valore>.env).
# - Nessun segreto e nessuna etichetta d'immagine hanno valore predefinito: se mancano,
#   il Compose non parte e dice quale manca.
# - Solo Caddy pubblica porte. Applicazioni, database, archivio e pulizia stanno su reti
#   interne, senza uscita verso Internet.
# - Il backup è a termine, nel profilo `backup`, e ha una rete con uscita propria (`backup-out`).
# - Le migrazioni non partono mai all'avvio: profilo `release`, comando esplicito (ADR-009 §4.4).
# - Limiti di memoria: produzione + staging restano sotto 7 GB sugli 8 del server (DR-334).
# =====================================================================

name: amoris-${AMORIS_ENV:?manca AMORIS_ENV (production o staging)}

# Limiti dei file caricati: gli stessi valori all'API e al servizio di pulizia (DR-359),
# così un file accettato dall'API non torna mai «troppo grande» dalla pulizia.
x-media-limits: &media-limits
  MEDIA_MAX_PDF_BYTES: ${MEDIA_MAX_PDF_BYTES:-20971520}
  MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-104857600}

# Applicazioni del progetto: file system in sola lettura, nessuna capacità, nessun nuovo privilegio.
x-hardened: &hardened
  read_only: true
  cap_drop: ['ALL']
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

# Rotazione dei log di ogni servizio: 5 file da 10 MB (DR-390).
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  caddy:
    logging: *logging
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    mem_limit: 128m
    cap_drop: ['ALL']
    cap_add: ['NET_BIND_SERVICE']
    security_opt: ['no-new-privileges:true']
    env_file:
      - path: ambiente/${AMORIS_ENV}.env
        required: true
    environment:
      AMORIS_ENV: ${AMORIS_ENV}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?manca CADDY_SITE_ADDRESS (nome del sito, per esempio www.dominio.it)}
      # Solo lo staging le usa (basic_auth); in produzione restano vuote e ignorate.
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:-}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH:-}
    ports:
      - '${CADDY_HTTP_PORT:?manca CADDY_HTTP_PORT}:80'
      - '${CADDY_HTTPS_PORT:?manca CADDY_HTTPS_PORT}:443'
      - '${CADDY_HTTPS_PORT}:443/udp'
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, app]
    depends_on:
      web: { condition: service_healthy }
      admin: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2020/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    logging: *logging
    <<: *hardened
    image: ${IMAGE_PREFIX:?manca IMAGE_PREFIX (per esempio ghcr.io/proprietario/amoris)}-web:${IMAGE_TAG:?manca IMAGE_TAG (hash del commit delle immagini)}
    mem_limit: 384m
    environment:
      API_URL: http://api:3002
      SITE_URL: ${SITE_URL:?manca SITE_URL (indirizzo pubblico del sito, https)}
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=64m,uid=10001,gid=10001
    networks: [app]

  admin:
    logging: *logging
    <<: *hardened
    image: ${IMAGE_PREFIX}-admin:${IMAGE_TAG}
    mem_limit: 256m
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/apps/admin/.next/cache:size=32m,uid=10001,gid=10001
    networks: [app]

  api:
    logging: *logging
    <<: *hardened
    image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
    mem_limit: 640m
    env_file:
      - path: ambiente/${AMORIS_ENV}.env
        required: true
    environment:
      <<: *media-limits
      # Ruolo applicativo: niente superutente, niente DDL (T6g).
      DATABASE_URL: postgres://amoris_app:${DB_APP_PASSWORD:?manca DB_APP_PASSWORD}@db:5432/${POSTGRES_DB:-amoris}
      IP_HASH_SALT: ${IP_HASH_SALT:?manca IP_HASH_SALT}
      CSRF_SECRET: ${CSRF_SECRET:?manca CSRF_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?manca TOTP_ENCRYPTION_KEY}
      # Tutta la sottorete app, non il solo Caddy: rischio accettato in Fase 1 (DR-402).
      TRUSTED_PROXY: ${APP_SUBNET:?manca APP_SUBNET}
      S3_ENDPOINT: http://objects:9000
      # Utente di servizio limitato ai due bucket, non l'amministratore dell'archivio (T6g).
      S3_ACCESS_KEY: amoris-api
      S3_SECRET_KEY: ${S3_API_SECRET_KEY:?manca S3_API_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-media-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-media-private}
      SCRUB_SERVICE_URL: http://scrub:3003
      SCRUB_SERVICE_TOKEN: ${SCRUB_SERVICE_TOKEN:?manca SCRUB_SERVICE_TOKEN}
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [app, data, scrub]
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      objects-init: { condition: service_completed_successfully }
      scrub: { condition: service_healthy }

  # Pulizia dei metadati di PDF e MP4 (DR-263, DR-359): rete interna con la sola API, 1 GB.
  # /tmp contiene originale e file ripulito del video più grande; se è troppo piccolo il
  # servizio non parte (controllo all'avvio).
  scrub:
    logging: *logging
    <<: *hardened
    image: ${IMAGE_PREFIX}-scrub:${IMAGE_TAG}
    mem_limit: 1g
    # Una pulizia video dura fino a 120 s: allo spegnimento la si lascia finire.
    stop_grace_period: 130s
    environment:
      <<: *media-limits
      SCRUB_SERVICE_TOKEN: ${SCRUB_SERVICE_TOKEN}
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [scrub]

  db:
    logging: *logging
    image: postgres:17.11-alpine@sha256:562a6e0a66b5136bc28bef5944bbc2ddddf8ea0058d4016b96cee63f2edaf143
    restart: unless-stopped
    mem_limit: 512m
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amoris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-amoris}
      # Collazione italiana, come in sviluppo: la ricerca full-text di ADR-002 la presuppone.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=it-IT --encoding=UTF8'
      LANG: it_IT.utf8
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      # Su TCP: al primo avvio il server temporaneo dell'inizializzazione ascolta solo sul socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Ruoli del database (T6g): gira a ogni `up`, come superutente, e riallinea ruoli, password e privilegi.
  # Solo qui e in `db` sta la password del superutente.
  db-init:
    logging: *logging
    <<: *hardened
    image: postgres:17.11-alpine@sha256:562a6e0a66b5136bc28bef5944bbc2ddddf8ea0058d4016b96cee63f2edaf143
    restart: 'no'
    user: postgres
    mem_limit: 64m
    entrypoint:
      - /bin/sh
      - -c
      - exec psql -X --no-password -q -v ON_ERROR_STOP=1 -v owner_pw="$$DB_OWNER_PASSWORD" -v app_pw="$$DB_APP_PASSWORD" -v backup_pw="$$DB_BACKUP_PASSWORD" -f /init/roles.sql
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-amoris}
      PGPASSWORD: ${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-amoris}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?manca DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?manca DB_APP_PASSWORD}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?manca DB_BACKUP_PASSWORD}
    volumes:
      - ./db-init/roles.sql:/init/roles.sql:ro
    tmpfs:
      - /tmp:size=1m
    networks: [data]
    depends_on:
      db: { condition: service_healthy }

  # Immagini Chainguard fissate per digest (DR-101), utente 65532.
  objects:
    logging: *logging
    image: cgr.dev/chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    restart: unless-stopped
    mem_limit: 384m
    security_opt: ['no-new-privileges:true']
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?manca S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?manca S3_SECRET_KEY}
      MINIO_BROWSER: 'off'
    volumes:
      - objects-data:/data
    networks: [data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Crea i due bucket di ADR-004 §3.6 e i due utenti di servizio (API e backup), poi esce; rieseguirlo non fa danno.
  # Solo qui e in `objects` stanno le credenziali principali dell'archivio.
  objects-init:
    logging: *logging
    image: cgr.dev/chainguard/minio-client@sha256:5feb4dcc570e7578f82e6c84384849e6557d005fb9b06f714c63f7184883b13f
    restart: 'no'
    mem_limit: 128m
    security_opt: ['no-new-privileges:true']
    depends_on:
      objects: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-media-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-media-private}
      S3_API_USER: amoris-api
      S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:?manca S3_API_SECRET_KEY}
      S3_BACKUP_USER: amoris-backup
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:?manca S3_BACKUP_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - /bin/sh /init/create-buckets.sh && /bin/sh /init/create-service-users.sh
    volumes:
      - ../compose/create-buckets.sh:/init/create-buckets.sh:ro
      - ./objects/create-service-users.sh:/init/create-service-users.sh:ro
    networks: [data]

  # Migrazioni (ADR-009 §4.4): solo con `--profile release run --rm migrate`, mai all'avvio.
  migrate:
    logging: *logging
    <<: *hardened
    image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
    profiles: ['release']
    restart: 'no'
    mem_limit: 256m
    command: ['node', 'bin/migrate.js']
    environment:
      # Ruolo proprietario degli oggetti: solo `migrate` e il ripristino lo usano (T6g).
      DATABASE_URL: postgres://amoris_owner:${DB_OWNER_PASSWORD:?manca DB_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-amoris}
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [data]
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }

  # Backup (1F-W3, DR-366/367): nessun processo acceso, parte solo con `--profile backup run --rm backup <comando>`
  # da un timer dell'host (W5); gira solo in produzione (DR-372): il vincolo sta nel timer, non qui.
  backup:
    logging: *logging
    <<: *hardened
    image: ${IMAGE_PREFIX}-backup:${IMAGE_TAG}
    profiles: ['backup']
    restart: 'no'
    # Con un processo init lo script non è PID 1 e riceve SIGTERM.
    init: true
    mem_limit: 384m
    entrypoint: ['amoris-backup']
    environment:
      HOME: /nonexistent
      # restic tiene la memoria sotto il limite del contenitore.
      GOMEMLIMIT: 256MiB
      PGHOST: db
      # Ruoli di sola lettura (T6g): `pg_dump` e copia dei bucket non scrivono nulla.
      PGUSER: amoris_backup
      PGDATABASE: ${POSTGRES_DB:-amoris}
      # Come per l'API: valori dal file d'ambiente (visibili con `docker inspect`, rischio accettato).
      PGPASSWORD: ${DB_BACKUP_PASSWORD:?manca DB_BACKUP_PASSWORD}
      S3_ENDPOINT: http://objects:9000
      S3_ACCESS_KEY: amoris-backup
      S3_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:?manca S3_BACKUP_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-media-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-media-private}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
      BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-23}
      BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
      BACKUP_SFTP_PATH: ${BACKUP_SFTP_PATH:-}
    secrets:
      - backup_ssh_key
      - backup_known_hosts
    tmpfs:
      - /tmp:size=16m,mode=1777
      # L'immagine di base dichiara questo volume: così `run --rm` non lascia volumi anonimi.
      - /var/lib/postgresql/data:size=1m
    volumes:
      - backup-data:/backup/data
      - backup-state:/backup/state
      - backup-cache:/backup/cache
    networks: [data, backup-out]
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      objects: { condition: service_healthy }

  # Ripristino (T6g): stesso servizio del backup, ma scrive. Database come proprietario degli oggetti,
  # archivio come utente dell'API (lettura e scrittura nei due bucket). Mai superutente né chiavi principali.
  #   docker compose ... --profile backup run --rm restore restore latest
  restore:
    extends:
      service: backup
    environment:
      PGUSER: amoris_owner
      PGPASSWORD: ${DB_OWNER_PASSWORD:?manca DB_OWNER_PASSWORD}
      S3_ACCESS_KEY: amoris-api
      S3_SECRET_KEY: ${S3_API_SECRET_KEY:?manca S3_API_SECRET_KEY}

# Chiave SSH e known_hosts del backup: file dell'host in /run/secrets, con percorso predefinito non
# segreto. Le altre variabili del backup sono vuote o predefinite apposta: lo staging non le imposta e
# senza di esse il backup si rifiuta di partire (codice 78), perché il Compose interpola tutto il file
# anche fuori dal profilo.
secrets:
  backup_ssh_key:
    file: ${BACKUP_SSH_KEY_PATH:-./backup-chiavi/ssh_key}
  backup_known_hosts:
    file: ${BACKUP_KNOWN_HOSTS_PATH:-./backup-chiavi/known_hosts}

networks:
  # Unica rete con uscita: Caddy riceve dall'esterno e chiede i certificati.
  edge: {}
  # Sottorete fissa: l'API si fida di `X-Forwarded-For` solo da questa rete (TRUSTED_PROXY), dove stanno Caddy e le applicazioni.
  # Obbligatoria e diversa per produzione e staging, che stanno sullo stesso server (DR-402).
  app:
    internal: true
    ipam:
      config:
        - subnet: ${APP_SUBNET:?manca APP_SUBNET (sottorete della rete app, diversa per produzione e staging, per esempio 10.77.84.0/24 e 10.77.85.0/24)}
  data: { internal: true }
  scrub: { internal: true }
  # Solo per il backup, verso la Storage Box; la destinazione la limita `firewall/backup-out.sh` sull'host (1F-W4 T6i).
  # Sottorete e bridge fissi, perché le regole li indicano; il backup gira solo in produzione (DR-372).
  backup-out:
    ipam:
      config:
        - subnet: ${BACKUP_OUT_SUBNET:-10.77.86.0/24}
    driver_opts:
      com.docker.network.bridge.name: ${BACKUP_OUT_BRIDGE:-amoris-bkp-out}

volumes:
  db-data:
  objects-data:
  caddy-data:
  caddy-config:
  backup-data:
  backup-state:
  backup-cache:
