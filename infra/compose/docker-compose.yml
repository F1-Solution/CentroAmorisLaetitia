# =====================================================================
# Ambiente di sviluppo locale. Forma da ADR-009 §4.1, storage da DR-005.
#
# In Fase 1C qui dentro girano solo i servizi con stato: database e
# storage a oggetti. Le tre applicazioni girano sulla macchina, con
# `pnpm dev`, perche' in sviluppo il ricaricamento a caldo vale piu'
# della somiglianza con la produzione.
#
# Il reverse proxy sta nel profilo `proxy` e non parte da solo: serve a
# provare l'instradamento di ADR-003, non allo sviluppo quotidiano.
# =====================================================================

name: amoris-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Collazione italiana: la ricerca full-text di ADR-002 la presuppone.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=it-IT --encoding=UTF8'
      LANG: it_IT.utf8
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  objects:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - objects-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Crea i due bucket di ADR-004 §3.6 e poi esce. Rieseguirlo non fa danno.
  objects-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      objects:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
    entrypoint: ['/bin/sh', '/init/create-buckets.sh']
    volumes:
      - ./create-buckets.sh:/init/create-buckets.sh:ro
    restart: 'no'

  caddy:
    image: caddy:2-alpine
    profiles: ['proxy']
    restart: unless-stopped
    ports:
      - '${PROXY_HTTP_PORT:-8080}:80'
    environment:
      WEB_UPSTREAM: host.docker.internal:${WEB_PORT:-3000}
      ADMIN_UPSTREAM: host.docker.internal:${ADMIN_PORT:-3001}
      API_UPSTREAM: host.docker.internal:${API_PORT:-3002}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  db-data:
  objects-data:
  caddy-data:
  caddy-config:
