packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: set this to true or false

# esbuild — annidato sotto tsx e drizzle-kit — porta uno script di
# installazione che non serve eseguire: il binario arriva dal pacchetto della
# piattaforma, gia' bloccato dal lockfile. Lo dichiariamo ignorato di proposito
# e togliamo l'interruzione, che altrimenti fa fallire ogni comando.
ignoredBuiltDependencies:
  - esbuild
strictDepBuilds: false

# sharp 0.35.5 corregge GHSA-wq5f-xc86-pv6w, anche per la copia facoltativa di next.
overrides:
  sharp: 0.35.5
  # fast-uri 3.1.9 e 4.2.3 correggono gli avvisi dei validatori di schema di Fastify e di swagger.
  'fast-uri@3': 3.1.9
  'fast-uri@4': 4.2.3
  # ip-address 10.7.4 corregge l'avviso di @fastify/rate-limit.
  ip-address: 10.7.4
  # source-map-js 1.2.2 corregge l'avviso di postcss, tirato da next.
  source-map-js: 1.2.2

# Eccezioni a `pnpm audit`: ogni GHSA va qui con una riga di motivo e la data di riesame, e si rimuove alla scadenza.
auditConfig:
  ignoreGhsas: []
